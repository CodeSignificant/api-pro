<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApiPro Log Viewer</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #1e1e1e;
            color: #d4d4d4;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #252526;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #569cd6;
        }
        .controls {
            display: flex;
            gap: 10px;
        }
        input[type="password"] {
            padding: 8px 12px;
            border: 1px solid #3c3c3c;
            background-color: #3c3c3c;
            color: #fff;
            border-radius: 4px;
            outline: none;
        }
        input[type="password"]:focus {
            border-color: #007acc;
        }
        button {
            padding: 8px 16px;
            background-color: #0e639c;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1177bb;
        }
        button.stop {
            background-color: #c53a3a;
        }
        button.stop:hover {
            background-color: #d14141;
        }
        .console {
            flex-grow: 1;
            background-color: #000;
            padding: 20px;
            border-radius: 8px;
            overflow-y: auto;
            white-space: pre-wrap;
            border: 1px solid #3c3c3c;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            font-size: 14px;
            line-height: 1.5;
        }
        .status {
            font-size: 0.9rem;
            color: #888;
        }
        .error-msg {
            color: #f48771;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Terminal :: prolog.log</h1>
        <div class="controls">
            <span class="status" id="statusIndicator">Disconnected</span>
            <input type="password" id="passwordInput" placeholder="Enter Log Password" />
            <button id="connectBtn" onclick="toggleConnection()">Connect</button>
        </div>
    </div>

    <div class="console" id="consoleOutput">
        Welcome to ApiPro Log Viewer.
        Enter the password configured in config.php to view live logs.
    </div>

    <script>
        let intervalId = null;
        let isConnected = false;
        const consoleOutput = document.getElementById('consoleOutput');
        const connectBtn = document.getElementById('connectBtn');
        const passwordInput = document.getElementById('passwordInput');
        const statusIndicator = document.getElementById('statusIndicator');

        function toggleConnection() {
            if (isConnected) {
                disconnect();
            } else {
                connect();
            }
        }

        function connect() {
            const password = passwordInput.value;
            if (!password) {
                alert("Please enter a password.");
                return;
            }

            isConnected = true;
            connectBtn.innerText = "Disconnect";
            connectBtn.classList.add("stop");
            passwordInput.disabled = true;
            statusIndicator.innerText = "Connected (Polling every 2s)";
            statusIndicator.style.color = "#4caf50";
            
            consoleOutput.innerHTML = "Connecting...\n";

            // Initial fetch
            fetchLogs(password);
            
            // Start polling every 2 seconds
            intervalId = setInterval(() => fetchLogs(password), 2000);
        }

        function disconnect() {
            isConnected = false;
            connectBtn.innerText = "Connect";
            connectBtn.classList.remove("stop");
            passwordInput.disabled = false;
            statusIndicator.innerText = "Disconnected";
            statusIndicator.style.color = "#888";

            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }
        }

        async function fetchLogs(password) {
            try {
                // Ensure this points to the correct endpoint path on your server
                const response = await fetch('/apipro/logs/read', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password: password })
                });

                const json = await response.json();

                if (json.success) {
                    const logs = json.logs ?? '';
                    
                    if (logs === '') {
                        consoleOutput.innerText = '[prolog.log is empty — no errors recorded yet]';
                    } else {
                        // Only update if content has changed to prevent flickering
                        if (consoleOutput.innerText !== logs) {
                            const isAtBottom = consoleOutput.scrollHeight - consoleOutput.clientHeight <= consoleOutput.scrollTop + 50;
                            
                            consoleOutput.innerText = logs;
                            
                            // Auto-scroll to bottom if user was already at the bottom
                            if (isAtBottom) {
                                consoleOutput.scrollTop = consoleOutput.scrollHeight;
                            }
                        }
                    }
                } else {
                    disconnect();
                    consoleOutput.innerHTML = `<span class="error-msg">Error: ${json.message}</span>`;
                }

            } catch (err) {
                disconnect();
                consoleOutput.innerHTML = `<span class="error-msg">Connection Error: Could not reach /apipro/logs/read. Ensure the API is running and the route is accessible.</span>`;
                console.error(err);
            }
        }
    </script>
</body>
</html>
