<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApiPro Tester - Interactive API Debugger</title>
    <meta name="description" content="ApiPro Tester: A premium, fast, interactive developer cockpit for debugging, running, and analyzing ApiPro security middleware endpoints in real-time.">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Fira+Code:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --method-get: #10b981;
            --method-post: #3b82f6;
            --method-put: #f59e0b;
            --method-delete: #ef4444;
            --method-patch: #8b5cf6;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .sidebar {
            width: 320px;
            background-color: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            box-shadow: 4px 0 15px rgba(0, 0, 0, 0.2);
            z-index: 10;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header h1 {
            margin: 0;
            font-size: 1.2rem;
            background: linear-gradient(90deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .routes-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .controller-group {
            margin-bottom: 15px;
        }

        .controller-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 700;
            padding: 5px 10px;
            letter-spacing: 1px;
        }

        .route-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px 8px 32px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 2px;
        }

        .route-item:hover,
        .route-item.active {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .route-item.active {
            border-left: 3px solid var(--accent);
            background-color: rgba(59, 130, 246, 0.1);
        }

        .method-badge {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 3px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            width: 45px;
            text-align: center;
        }

        .method-GET {
            background-color: rgba(16, 185, 129, 0.2);
            color: var(--method-get);
        }

        .method-POST {
            background-color: rgba(59, 130, 246, 0.2);
            color: var(--method-post);
        }

        .method-PUT {
            background-color: rgba(245, 158, 11, 0.2);
            color: var(--method-put);
        }

        .method-DELETE {
            background-color: rgba(239, 68, 68, 0.2);
            color: var(--method-delete);
        }

        .method-PATCH {
            background-color: rgba(139, 92, 246, 0.2);
            color: var(--method-patch);
        }

        .accordion-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            user-select: none;
        }

        .accordion-header:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .accordion-header.open {
            background: rgba(59, 130, 246, 0.08);
        }

        .accordion-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .accordion-base {
            font-size: 0.75rem;
            font-family: 'Fira Code', monospace;
            color: var(--text-muted);
            margin-left: 4px;
            font-weight: 400;
        }

        .accordion-chevron {
            transition: transform 0.2s;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .accordion-chevron.open {
            transform: rotate(90deg);
        }

        .accordion-body {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.25s ease;
        }

        .accordion-body.open {
            max-height: 500px;
        }

        .route-path {
            font-size: 0.85rem;
            font-family: 'Fira Code', monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Main Workspace */
        .workspace {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: radial-gradient(circle at top right, #1e293b 0%, #0f172a 100%);
        }

        .workspace-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            font-size: 1.2rem;
        }

        .workspace-content {
            display: none;
            /* hidden by default */
            flex-direction: column;
            height: 100%;
        }

        .request-header {
            padding: 20px 30px;
            border-bottom: 1px solid var(--border-color);
            background: rgba(30, 41, 59, 0.5);
            backdrop-filter: blur(10px);
        }

        .endpoint-display {
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--bg-color);
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-family: 'Fira Code', monospace;
            font-size: 1.1rem;
        }

        .endpoint-display .method-badge {
            font-size: 0.9rem;
            width: auto;
            padding: 5px 10px;
        }

        .content-split {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
        }

        /* Form Area */
        .form-area {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            border-right: 1px solid var(--border-color);
            min-width: 0;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            margin: 0 0 15px 0;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background-color: var(--border-color);
        }

        .form-group {
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.02);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .param-label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .badge-required {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 20px;
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-optional {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 2px 7px;
            border-radius: 20px;
            background: rgba(148, 163, 184, 0.1);
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-family: 'Fira Code', monospace;
        }

        .form-input {
            width: 100%;
            padding: 10px 15px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            font-family: 'Fira Code', monospace;
            font-size: 0.9rem;
            box-sizing: border-box;
            transition: border 0.2s;
        }

        .form-input:focus {
            border-color: var(--accent);
            outline: none;
        }

        .send-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .send-btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        /* Response Area */
        .response-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
            min-width: 0;
        }

        .response-header {
            padding: 15px 30px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-pill {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 700;
            font-family: 'Fira Code', monospace;
        }

        .status-200 {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .status-400 {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        .status-500 {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .response-body {
            flex-grow: 1;
            padding: 20px 30px;
            overflow-y: auto;
            margin: 0;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            color: #a6accd;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .string {
            color: #89ddff;
        }

        .number {
            color: #f78c6c;
        }

        .boolean {
            color: #ff5370;
        }

        .null {
            color: #ff5370;
            font-weight: bold;
        }

        .key {
            color: #c3e88d;
        }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }

        ::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        /* Responsive Mobile Layout Rules */
        .sidebar-backdrop {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 99;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .sidebar-backdrop.active {
            display: block;
            opacity: 1;
            pointer-events: auto;
        }

        .mobile-hamburger {
            display: none;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .mobile-hamburger:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: var(--accent);
        }

        @media (max-width: 768px) {
            body {
                position: relative;
                overflow-y: auto !important;
                height: auto;
            }

            .workspace {
                height: auto;
                overflow: visible !important;
            }

            .sidebar {
                position: fixed;
                left: -320px;
                top: 0;
                bottom: 0;
                width: 300px;
                transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                z-index: 100;
                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.5);
            }

            .sidebar.mobile-open {
                left: 0;
            }

            .mobile-hamburger {
                display: flex;
            }

            /* Stack workspace on mobile */
            .workspace-content {
                flex-direction: column;
                height: auto;
                overflow: visible !important;
            }

            .request-header {
                position: sticky;
                top: 0;
                z-index: 10;
                background: rgba(30, 41, 59, 0.95) !important;
                backdrop-filter: blur(10px);
                border-bottom: 1px solid var(--border-color);
                padding: 15px 20px;
            }

            .content-split {
                flex-direction: column;
                height: auto;
                overflow: visible !important;
            }

            .form-area {
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                flex: none;
                height: auto;
                max-height: none;
                overflow-y: visible;
                padding: 20px;
            }

            .response-area {
                flex: none;
                height: auto;
                min-height: 400px;
                overflow-y: visible;
                padding: 0;
            }

            .response-body {
                overflow-y: visible !important;
                overflow-x: auto !important;
                padding: 15px 20px;
            }

            .response-header {
                padding: 15px 20px;
            }
        }
    </style>
</head>

                <button id="toggleAllBtn" onclick="toggleAllGroups()" title="Expand All Groups" style="
                    background: transparent;
                    border: 1px solid var(--border-color);

                    width: 28px;
                    height: 28px;
                    border-radius: 4px;
                    cursor: pointer;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    transition: all 0.2s;
                ">
                    <svg id="toggleAllIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"

                        <polyline points="7 13 12 18 17 13"></polyline>
                        <polyline points="7 6 12 11 17 6"></polyline>
                    </svg>
                </button>
            </div>
        </div>

            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">

                <button onclick="clearToken()" title="Clear token" style="padding:7px 10px; background:rgba(239,68,68,0.1); color:#ef4444; border:1px solid rgba(239,68,68,0.2); border-radius:5px; cursor:pointer; font-size:0.78rem; transition:background 0.2s;" onmouseover="this.style.background='rgba(239,68,68,0.2)'" onmouseout="this.style.background='rgba(239,68,68,0.1)'">✕</button>

        <div class="routes-list" id="routesList">
            <!-- Populated by JS -->
            <div style="text-align: center; padding: 20px; color: #64748b;">Loading routes...</div>
        </div>

        <!-- Slide-up Token Panel -->
        <div id="tokenPanel" style="
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.3s ease, padding 0.3s ease;
            border-top: 0px solid var(--border-color);
            background: var(--panel-bg);
        ">
            <div style="padding: 14px;">
                <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;">
                    <span
                        style="font-size:0.75rem; font-weight:700; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.8px;">Bearer
                        Token</span>
                    <span id="tokenStatus" style="font-size:0.65rem; color:#64748b;">Not set</span>
                </div>
                <div style="display:flex; gap:6px;">
                    <input type="password" id="bearerTokenInput" placeholder="Paste JWT token..."
                        style="flex:1; padding:8px 10px; background:var(--bg-color); border:1px solid var(--border-color); color:var(--text-main); border-radius:5px; font-family:'Fira Code',monospace; font-size:0.78rem; outline:none; transition:border 0.2s;"
                        onfocus="this.style.borderColor='var(--accent)'"
                        onblur="this.style.borderColor='var(--border-color)'"
                        onkeydown="if(event.key==='Enter') saveToken()" />
                    <button onclick="saveToken()"
                        style="padding:8px 12px; background:var(--accent); color:white; border:none; border-radius:5px; cursor:pointer; font-size:0.78rem; font-weight:600;">Save</button>
                    <button onclick="clearToken()" title="Clear"
                        style="padding:8px 10px; background:rgba(239,68,68,0.1); color:#ef4444; border:1px solid rgba(239,68,68,0.2); border-radius:5px; cursor:pointer; font-size:0.78rem;">✕</button>
                </div>
            </div>
        </div>

        <!-- Bottom Icon Bar -->
        <div style="display:flex; border-top: 1px solid var(--border-color);">
            <!-- Token Icon Button -->
            <button id="tokenIconBtn" onclick="toggleTokenPanel()" title="Bearer Token" style="
                flex: 1;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                padding: 14px;

                display: flex;

                text-decoration: none;

                font-weight: 500;
                transition: all 0.2s;

                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                </svg>
                Logs
            </a>
        </div>
    </div>

    <div class="workspace">
        <div class="workspace-empty" id="emptyState">
            <button class="mobile-hamburger" onclick="toggleMobileSidebar()" title="Toggle Sidebar"
                style="margin-bottom: 15px;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
            Select an endpoint from the sidebar to begin testing
        </div>

        <div class="workspace-content" id="activeState">
            <div class="request-header">
                <button class="mobile-hamburger" onclick="toggleMobileSidebar()" title="Toggle Sidebar"
                    style="margin-right: 15px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <div class="endpoint-display">
                    <span class="method-badge" id="headerMethod">GET</span>
                    <span id="headerPath">/api/test</span>
                </div>
            </div>

            <div class="content-split">
                <div class="form-area">
                    <form id="requestForm" onsubmit="event.preventDefault(); sendRequest();">

                        <div id="querySection" style="display: none;">
                            <h3 class="section-title">Query Parameters</h3>
                            <div id="queryFields"></div>
                        </div>

                        <div id="bodySection" style="display: none;">
                            <h3 class="section-title">Body / JSON</h3>
                            <div id="bodyFields"></div>
                        </div>

                        <div id="fileSection" style="display: none;">
                            <h3 class="section-title">Files (Multipart)</h3>
                            <div id="fileFields"></div>
                        </div>

                        <div style="display:flex; gap:10px; margin-top:20px;">
                            <button type="submit" class="send-btn" id="sendBtn" style="flex:2; margin-top:0;">
                                <span>Send Request</span>
                                <div class="loader" id="loader"></div>
                            </button>
                            <button type="button" class="send-btn" onclick="copyCurl()"
                                style="flex:1; margin-top:0; background-color:var(--panel-bg); color:var(--text-main); border:1px solid var(--border-color);">
                                Copy cURL
                            </button>
                        </div>
                    </form>
                </div>

                <div class="response-area">
                    <div class="response-header">
                        <span style="font-weight: 600; color: var(--text-muted);">Response</span>
                        <div style="display: flex; gap: 15px; align-items: center;">
                            <button id="copyResponseBtn" onclick="copyResponse()" title="Copy Response" style="
                                display: none;
                                align-items: center;
                                justify-content: center;
                                background: rgba(255, 255, 255, 0.05);
                                border: 1px solid var(--border-color);
                                color: var(--text-muted);
                                border-radius: 4px;
                                padding: 4px 8px;
                                font-size: 0.75rem;
                                cursor: pointer;
                                transition: all 0.2s ease;
                                font-weight: 600;
                            ">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                                    style="margin-right: 4px;">
                                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                                </svg>
                                Copy
                            </button>
                            <span style="color: var(--text-muted); font-size: 0.8rem;" id="responseTime">0 ms</span>
                            <span class="status-pill status-200" id="responseStatus" style="display: none;">200
                                OK</span>
                        </div>
                    </div>
                    <pre class="response-body" id="responseBody">Awaiting request...</pre>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentRoute = null;
        let bearerToken = localStorage.getItem('apipro_bearer_token') || '';

        // Init token UI on load
        function toggleTokenPanel() {
            const panel = document.getElementById('tokenPanel');
            const btn = document.getElementById('tokenIconBtn');
            const isOpen = panel.style.maxHeight !== '0px' && panel.style.maxHeight !== '';
            if (isOpen) {
                panel.style.maxHeight = '0px';
                panel.style.borderTopWidth = '0px';
                btn.style.color = bearerToken ? '#10b981' : 'var(--text-muted)';
            } else {
                panel.style.maxHeight = '160px';
                panel.style.borderTopWidth = '1px';
                btn.style.color = 'var(--accent)';
                document.getElementById('bearerTokenInput').focus();
            }
        }

        function updateTokenIcon() {
            const btn = document.getElementById('tokenIconBtn');
            if (!btn) return;
            btn.style.color = bearerToken ? '#10b981' : 'var(--text-muted)';
        }

        function initToken() {
            if (bearerToken) {
                document.getElementById('bearerTokenInput').value = bearerToken;
                document.getElementById('tokenStatus').textContent = '✓ Active';
                document.getElementById('tokenStatus').style.color = '#10b981';
            }
            updateTokenIcon();
        }

        function saveToken() {
            bearerToken = document.getElementById('bearerTokenInput').value.trim();
            localStorage.setItem('apipro_bearer_token', bearerToken);
            const status = document.getElementById('tokenStatus');
            if (bearerToken) {
                status.textContent = '✓ Active';
                status.style.color = '#10b981';
            } else {
                status.textContent = 'Not set';
                status.style.color = '#64748b';
            }
            updateTokenIcon();
        }

        function clearToken() {
            bearerToken = '';
            document.getElementById('bearerTokenInput').value = '';
            localStorage.removeItem('apipro_bearer_token');
            document.getElementById('tokenStatus').textContent = 'Not set';
            document.getElementById('tokenStatus').style.color = '#64748b';
            updateTokenIcon();
        }

        // Fetch Routes on Load
        async function loadRoutes() {
            try {
                const res = await fetch('/apipro/tester/routes');
                const json = await res.json();

                if (json.success && json.data && json.data.tree) {
                    renderSidebar(json.data.tree);
                } else {
                    document.getElementById('routesList').innerHTML = `<div style="color:#ef4444; padding:20px;">Failed to load routes</div>`;
                }
            } catch (err) {
                document.getElementById('routesList').innerHTML = `<div style="color:#ef4444; padding:20px;">Network error loading routes: ${err.message}<br><br>Make sure you are accessing this via http://127.0.0.1:8000/test.html and not directly opening the file.</div>`;
            }
        }

        function renderSidebar(tree) {
            const list = document.getElementById('routesList');
            list.innerHTML = '';

            for (const [controller, routes] of Object.entries(tree)) {
                // Derive the display name and base path from the controller name
                const displayName = controller.replace('Controller', '');
                const basePath = commonPrefix(routes.map(r => r.path));

                const group = document.createElement('div');
                group.className = 'controller-group';

                // Accordion header
                const header = document.createElement('div');
                header.className = 'accordion-header';
                header.innerHTML = `
                    <div class="accordion-label">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:#60a5fa">
                            <rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/>
                        </svg>
                        ${displayName}
                        <span class="accordion-base">${basePath}</span>
                    </div>
                    <svg class="accordion-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"/>
                    </svg>
                `;

                // Accordion body
                const body = document.createElement('div');
                body.className = 'accordion-body';

                routes.forEach(route => {
                    const suffix = route.path.slice(basePath.length) || '/';
                    const item = document.createElement('div');
                    item.className = 'route-item';
                    item.innerHTML = `
                        <span class="method-badge method-${route.method}">${route.method}</span>
                        <span class="route-path" title="${route.path}">${suffix}</span>
                    `;
                    item.onclick = () => selectRoute(route, item);
                    body.appendChild(item);
                });

                // Toggle logic
                header.onclick = () => {
                    const isOpen = body.classList.contains('open');
                    header.classList.toggle('open', !isOpen);
                    body.classList.toggle('open', !isOpen);
                    header.querySelector('.accordion-chevron').classList.toggle('open', !isOpen);

                    const anyOpen = Array.from(document.querySelectorAll('.accordion-body'))
                        .some(b => b.classList.contains('open'));
                    updateToggleAllIcon(anyOpen);
                };

                // Default open first group
                if (list.children.length === 0) {
                    header.classList.add('open');
                    body.classList.add('open');
                    header.querySelector('.accordion-chevron').classList.add('open');
                }

                group.appendChild(header);
                group.appendChild(body);
                list.appendChild(group);
            }
        }

        function commonPrefix(paths) {
            if (!paths.length) return '';
            const segments = paths[0].split('/');
            let prefix = '';
            for (let i = 0; i < segments.length; i++) {
                const seg = segments[i];
                if (paths.every(p => p.split('/')[i] === seg)) {
                    prefix += (i === 0 ? '' : '/') + seg;
                } else break;
            }
            return prefix;
        }

        function selectRoute(route, element) {
            // Update UI active state
            document.querySelectorAll('.route-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            currentRoute = route;

            // Switch workspace
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('activeState').style.display = 'flex';

            // Reset Response
            document.getElementById('responseBody').innerHTML = 'Awaiting request...';
            document.getElementById('responseStatus').style.display = 'none';
            document.getElementById('responseTime').innerText = '';

            const copyBtn = document.getElementById('copyResponseBtn');
            if (copyBtn) copyBtn.style.display = 'none';

            closeMobileSidebar();

            // Update Header
            const headerMethod = document.getElementById('headerMethod');
            headerMethod.innerText = route.method;
            headerMethod.className = `method-badge method-${route.method}`;
            document.getElementById('headerPath').innerText = route.path;

            // Build Forms
            buildFormSection('querySection', 'queryFields', route.params || [], route.required_params || []);
            buildFormSection('bodySection', 'bodyFields', route.body || [], route.required_body || []);
            buildFileSection('fileSection', 'fileFields', route.files || [], route.required_files || []);
        }

        function buildFormSection(sectionId, containerId, params, required = []) {
            const section = document.getElementById(sectionId);
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            if (params.length === 0) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            params.forEach(param => {
                const isRequired = required.includes(param);
                const group = document.createElement('div');
                group.className = 'form-group';
                group.innerHTML = `
                    <div class="param-label-row">
                        <label class="form-label" style="margin:0;">${param}</label>
                        <span class="${isRequired ? 'badge-required' : 'badge-optional'}">${isRequired ? 'Required' : 'Optional'}</span>
                    </div>
                    <input type="text" class="form-input" name="param_${param}" data-key="${param}" placeholder="Enter ${param}..." ${isRequired ? 'required' : ''} />
                `;
                container.appendChild(group);
            });
        }

        function buildFileSection(sectionId, containerId, files, required = []) {
            const section = document.getElementById(sectionId);
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            if (files.length === 0) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            files.forEach(file => {
                const isRequired = required.includes(file);
                const group = document.createElement('div');
                group.className = 'form-group';
                group.innerHTML = `
                    <div class="param-label-row">
                        <label class="form-label" style="margin:0;">${file}</label>
                        <span class="${isRequired ? 'badge-required' : 'badge-optional'}">${isRequired ? 'Required' : 'Optional'}</span>
                    </div>
                    <input type="file" class="form-input" name="file_${file}" data-key="${file}" style="padding: 7px;" />
                `;
                container.appendChild(group);
            });
        }

        async function sendRequest() {
            if (!currentRoute) return;

            const btn = document.getElementById('sendBtn');
            const loader = document.getElementById('loader');
            const span = btn.querySelector('span');

            span.style.display = 'none';
            loader.style.display = 'block';
            btn.disabled = true;

            const startTime = performance.now();

            try {
                // 1. Build Query String
                let url = currentRoute.path;
                const queryInputs = document.querySelectorAll('#queryFields input');
                const queryParams = new URLSearchParams();
                queryInputs.forEach(input => {
                    if (input.value) queryParams.append(input.dataset.key, input.value);
                });

                const qs = queryParams.toString();
                if (qs) url += '?' + qs;

                // 2. Prepare Fetch Options
                const options = {
                    method: currentRoute.method,
                    headers: {}
                };

                // Inject Bearer token if set
                if (bearerToken) {
                    options.headers['Authorization'] = `Bearer ${bearerToken}`;
                }

                const bodyInputs = document.querySelectorAll('#bodyFields input');
                const fileInputs = document.querySelectorAll('#fileFields input');

                if (fileInputs.length > 0) {
                    // Send as FormData if files exist
                    const formData = new FormData();
                    bodyInputs.forEach(input => {
                        if (input.value) formData.append(input.dataset.key, input.value);
                    });
                    fileInputs.forEach(input => {
                        if (input.files.length > 0) formData.append(input.dataset.key, input.files[0]);
                    });
                    options.body = formData;
                } else if (bodyInputs.length > 0) {
                    // Send as JSON
                    const jsonBody = {};
                    bodyInputs.forEach(input => {
                        if (input.value) jsonBody[input.dataset.key] = input.value;
                    });
                    options.headers['Content-Type'] = 'application/json';
                    options.body = JSON.stringify(jsonBody);
                }

                if (currentRoute.method === 'GET' || currentRoute.method === 'HEAD') {
                    delete options.body;
                    delete options.headers['Content-Type'];
                }

                // 3. Execute
                const response = await fetch(url, options);

                // 4. Parse Response
                const text = await response.text();
                let jsonResponse;
                try {
                    jsonResponse = JSON.parse(text);
                } catch (e) {
                    jsonResponse = text; // Not JSON
                }

                const endTime = performance.now();
                renderResponse(response.status, response.statusText, Math.round(endTime - startTime), jsonResponse);

            } catch (err) {
                renderResponse(0, 'Network Error', 0, err.message);
            } finally {
                span.style.display = 'inline';
                loader.style.display = 'none';
                btn.disabled = false;
            }
        }

        function copyCurl() {
            if (!currentRoute) return;

            let url = window.location.origin + currentRoute.path;

            const queryInputs = document.querySelectorAll('#queryFields input');
            const queryParams = new URLSearchParams();
            queryInputs.forEach(input => {
                if (input.value) queryParams.append(input.dataset.key, input.value);
            });
            const qs = queryParams.toString();
            if (qs) url += '?' + qs;

            let curl = `curl -X ${currentRoute.method} "${url}"`;

            // Add Bearer token to cURL if set
            if (bearerToken) {
                curl += ` -H "Authorization: Bearer ${bearerToken}"`;
            }

            const bodyInputs = document.querySelectorAll('#bodyFields input');
            const fileInputs = document.querySelectorAll('#fileFields input');

            if (fileInputs.length > 0) {
                bodyInputs.forEach(input => {
                    if (input.value) curl += ` -F "${input.dataset.key}=${input.value}"`;
                });
                fileInputs.forEach(input => {
                    if (input.files.length > 0) curl += ` -F "${input.dataset.key}=@/path/to/${input.files[0].name}"`;
                });
            } else if (bodyInputs.length > 0 && currentRoute.method !== 'GET' && currentRoute.method !== 'HEAD') {
                const jsonBody = {};
                bodyInputs.forEach(input => {
                    if (input.value) jsonBody[input.dataset.key] = input.value;
                });
                curl += ` -H "Content-Type: application/json" -d '${JSON.stringify(jsonBody)}'`;
            }

            navigator.clipboard.writeText(curl).then(() => {
                alert("cURL copied to clipboard!");
            }).catch(err => {
                alert("Failed to copy: " + err);
            });
        }

        function renderResponse(status, statusText, time, data) {
            lastResponseData = data;
            const copyBtn = document.getElementById('copyResponseBtn');
            if (copyBtn) {
                copyBtn.style.display = 'flex';
                copyBtn.innerHTML = `
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    Copy
                `;
            }

            const statusEl = document.getElementById('responseStatus');
            statusEl.style.display = 'block';
            statusEl.innerText = `${status} ${statusText}`;
            statusEl.className = 'status-pill';

            if (status >= 200 && status < 300) statusEl.classList.add('status-200');
            else if (status >= 400 && status < 500) statusEl.classList.add('status-400');
            else statusEl.classList.add('status-500');

            document.getElementById('responseTime').innerText = `${time} ms`;

            if (typeof data === 'string') {
                document.getElementById('responseBody').innerHTML = escapeHtml(data);
            } else {
                document.getElementById('responseBody').innerHTML = syntaxHighlight(JSON.stringify(data, null, 4));
            }
        }

        function escapeHtml(unsafe) {
            return unsafe
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function syntaxHighlight(json) {
            json = escapeHtml(json);
            return json.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                let cls = 'number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) {
                        cls = 'key';
                    } else {
                        cls = 'string';
                    }
                } else if (/true|false/.test(match)) {
                    cls = 'boolean';
                } else if (/null/.test(match)) {
                    cls = 'null';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });
        }

        let lastResponseData = null;

        function copyResponse() {
            if (!lastResponseData) return;
            const textToCopy = typeof lastResponseData === 'string'
                ? lastResponseData
                : JSON.stringify(lastResponseData, null, 4);

            navigator.clipboard.writeText(textToCopy).then(() => {
                const btn = document.getElementById('copyResponseBtn');
                if (btn) {
                    btn.innerHTML = `
                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        Copied!
                    `;
                    setTimeout(() => {
                        btn.innerHTML = `
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 4px;"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            Copy
                        `;
                    }, 2000);
                }
            }).catch(err => {
                alert("Failed to copy: " + err);
            });
        }

        function toggleMobileSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const backdrop = document.getElementById('sidebarBackdrop');
            if (sidebar) sidebar.classList.toggle('mobile-open');
            if (backdrop) backdrop.classList.toggle('active');
        }

        function closeMobileSidebar() {
            const sidebar = document.querySelector('.sidebar');
            const backdrop = document.getElementById('sidebarBackdrop');
            if (sidebar) sidebar.classList.remove('mobile-open');
            if (backdrop) backdrop.classList.remove('active');
        }

        function toggleAllGroups() {
            const anyOpen = Array.from(document.querySelectorAll('.accordion-body'))
                .some(body => body.classList.contains('open'));
            const shouldExpand = !anyOpen;

            const headers = document.querySelectorAll('.accordion-header');
            const bodies = document.querySelectorAll('.accordion-body');

            headers.forEach(header => {
                const chevron = header.querySelector('.accordion-chevron');
                if (shouldExpand) {
                    header.classList.add('open');
                    if (chevron) chevron.classList.add('open');
                } else {
                    header.classList.remove('open');
                    if (chevron) chevron.classList.remove('open');
                }
            });

            bodies.forEach(body => {
                if (shouldExpand) {
                    body.classList.add('open');
                } else {
                    body.classList.remove('open');
                }
            });

            updateToggleAllIcon(shouldExpand);
        }

        function updateToggleAllIcon(anyOpen) {
            const btn = document.getElementById('toggleAllBtn');
            const icon = document.getElementById('toggleAllIcon');
            if (!btn || !icon) return;

            if (anyOpen) {
                btn.title = "Collapse All Groups";
                icon.innerHTML = `
                    <polyline points="17 11 12 6 7 11"></polyline>
                    <polyline points="17 18 12 13 7 18"></polyline>
                `;
            } else {
                btn.title = "Expand All Groups";
                icon.innerHTML = `
                    <polyline points="7 13 12 18 17 13"></polyline>
                    <polyline points="7 6 12 11 17 6"></polyline>
                `;
            }
        }

        // Init
        initToken();
        loadRoutes();
    </script>
</body>

</html>
